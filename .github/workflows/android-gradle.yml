name: Android Gradle Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          adb version
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"

      - name: Install Godot 4.5.2
        run: |
          set -eux
          GODOT_VERSION="4.5.2"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install matching Godot export templates
        run: |
          set -eux
          GODOT_VERSION="4.5.2"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot_templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_source.zip"
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Godot Android paths
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"
          cat > "$SETTINGS" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Install project Gradle build template
        run: godot --headless --path . --install-android-build-template

      - name: Verify Gradle template
        run: |
          test -f android/build/gradlew
          test -f android/build/build.gradle
          chmod +x android/build/gradlew

      - name: Export Android debug build
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/ShatteredRealms.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-android-debug
          path: build/android/ShatteredRealms.apk
          if-no-files-found: error