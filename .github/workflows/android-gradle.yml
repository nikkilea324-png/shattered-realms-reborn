name: Android Gradle Build\n\non:\n  push:\n    branches: [ main ]\n  workflow_dispatch:\n\njobs:\n  android-gradle:\n    runs-on: ubuntu-latest\n    container:\n      image: barichello/godot-ci:4.5.2\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Verify Godot and Android toolchain\n        run: |\n          godot --version\n          java -version\n          test -x /usr/lib/android-sdk/platform-tools/adb\n          test -d /usr/lib/android-sdk/build-tools/33.0.2\n          test -d /usr/lib/android-sdk/platforms/android-33\n\n      - name: Install matching Godot 4.5.2 Android templates\n        run: |\n          set -eux\n          GODOT_VERSION="4.5.2"\n          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"\n          mkdir -p "$TEMPLATE_DIR"\n          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot_templates.tpz\n          rm -rf /tmp/godot_templates\n          mkdir -p /tmp/godot_templates\n          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates\n          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"\n          test -f "$TEMPLATE_DIR/android_source.zip"\n          test -f "$TEMPLATE_DIR/android_debug.apk"\n\n      - name: Configure Godot Android paths\n        run: |\n          set -eux\n          mkdir -p "$HOME/.config/godot"\n          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"\n          cat > "$SETTINGS" <<EOF\n          [gd_resource type="EditorSettings" format=3]\n\n          [resource]\n          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\n          export/android/android_sdk_path = "/usr/lib/android-sdk"\n          export/android/debug_keystore = "/root/debug.keystore"\n          export/android/debug_keystore_user = "androiddebugkey"\n          export/android/debug_keystore_pass = "android"\n          EOF\n\n      - name: Import project\n        run: godot --headless --editor --quit --path .\n\n      - name: Export Android debug build\n        run: |\n          mkdir -p build/android\n          godot --headless --path . --export-debug "Android" build/android/ShatteredRealms.apk\n\n      - name: Upload Android APK\n        uses: actions/upload-artifact@v4\n        with:\n          name: shattered-realms-android-debug\n          path: build/android/ShatteredRealms.apk\n          if-no-files-found: error\n