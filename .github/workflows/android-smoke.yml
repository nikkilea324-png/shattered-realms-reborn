name: Android Build Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Smoke test
        run: |
          java -version
          echo "Android build runner is alive"
