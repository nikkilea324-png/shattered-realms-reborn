name: Shattered Realms CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          uname -a
          git --version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Godot 4.5.2
        run: |
          set -eux
          V="4.5.2"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          set -eux
          V="4.5.2"
          D="$HOME/.local/share/godot/export_templates/${V}.stable"
          mkdir -p "$D"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/templates
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$D/"
          test -f "$D/android_source.zip"
          test -f "$D/android_debug.apk"

      - name: Configure Godot Android
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
[gd_resource type=EditorSettings format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Install Gradle build template
        run: godot --headless --path . --install-android-build-template

      - name: Verify Gradle
        run: |
          set -eux
          test -f android/build/gradlew
          test -f android/build/build.gradle
          chmod +x android/build/gradlew
          cd android/build
          ./gradlew --version

      - name: Export Android debug APK
        run: |
          set -eux
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/ShatteredRealms.apk
          test -s build/android/ShatteredRealms.apk
          ls -lh build/android/ShatteredRealms.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-android-debug
          path: build/android/ShatteredRealms.apk
          if-no-files-found: error
