name: Shattered Realms CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -eux
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          "$SDKMANAGER" --list_installed

      - name: Install Godot 4.5.2
        shell: bash
        run: |
          set -eux
          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v4.5.2-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -eux
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz" -o /tmp/godot_templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_source.zip"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '%s\n'             '[gd_resource type="EditorSettings" format=3]'             ''             '[resource]'             "export/android/java_sdk_path = \"$JAVA_HOME\""             "export/android/android_sdk_path = \"$ANDROID_HOME\""             "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""             'export/android/debug_keystore_user = "androiddebugkey"'             'export/android/debug_keystore_pass = "android"'             > "$HOME/.config/godot/editor_settings-4.5.tres"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Prepare minimal Android export preset
        shell: bash
        run: |
          set -eux
          test -f "$HOME/.local/share/godot/export_templates/4.5.2.stable/android_debug.apk"
          printf '%s\n' '[preset.0]'
          printf '%s\n' ''
          printf '%s\n' 'name="Android"'
          printf '%s\n' 'platform="Android"'
          printf '%s\n' 'runnable=true'
          printf '%s\n' 'dedicated_server=false'
          printf '%s\n' 'custom_features=""'
          printf '%s\n' 'export_filter="all_resources"'
          printf '%s\n' 'include_filter=""'
          printf '%s\n' 'exclude_filter=""'
          printf '%s\n' 'export_path="build/android/ShatteredRealms.apk"'
          printf '%s\n' 'encryption_include_filters=""'
          printf '%s\n' 'encryption_exclude_filters=""'
          printf '%s\n' 'encrypt_pck=false'
          printf '%s\n' 'encrypt_directory=false'
          printf '%s\n' ''
          printf '%s\n' '[preset.0.options]'
          printf '%s\n' ''
          printf '%s\n' 'custom_template/debug=""'
          printf '%s\n' 'custom_template/release=""'
          printf '%s\n' 'gradle_build/use_gradle_build=false'
          printf '%s\n' 'gradle_build/export_format=0'
          printf '%s\n' 'gradle_build/min_sdk=""'
          printf '%s\n' 'gradle_build/target_sdk=""'
          printf '%s\n' 'architectures/armeabi-v7a=false'
          printf '%s\n' 'architectures/arm64-v8a=true'
          printf '%s\n' 'architectures/x86=false'
          printf '%s\n' 'architectures/x86_64=false'
          printf '%s\n' 'version/code=1'
          printf '%s\n' 'version/name="0.1.0"'
          printf '%s\n' 'package/unique_name="com.shatteredrealms.game"'
          printf '%s\n' 'package/name="Shattered Realms"'
          printf '%s\n' 'package/signed=true'
          printf '%s\n' 'package/app_category=2'
          printf '%s\n' 'package/retain_data_on_uninstall=false'
          printf '%s\n' 'package/exclude_from_recents=false'
          printf '%s\n' 'package/show_in_android_tv=false'
          printf '%s\n' 'package/show_in_app_library=true'
          printf '%s\n' 'package/show_as_launcher_app=false'
          printf '%s\n' 'graphics/opengl_debug=false'
          printf '%s\n' 'xr_features/xr_mode=0'
          printf '%s\n' 'screen/immersive_mode=true'
          printf '%s\n' 'screen/support_small=true'
          printf '%s\n' 'screen/support_normal=true'
          printf '%s\n' 'screen/support_large=true'
          printf '%s\n' 'screen/support_xlarge=true'
          printf '%s\n' 'user_data_backup/allow=false'
          printf '%s\n' 'command_line/extra_args=""'
          printf '%s\n' 'apk_expansion/enable=false'
          printf '%s\n' 'apk_expansion/SALT=""'
          printf '%s\n' 'apk_expansion/public_key=""'
          printf '%s\n' 'permissions/custom_permissions=PackedStringArray()'
          printf '%s\n' ''
          grep -E 'name=|gradle_build/use_gradle_build|package/unique_name|package/signed' export_presets.cfg

      - name: Export Android debug APK
        shell: bash
        run: |
          set -eux
          mkdir -p build/android
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android" \
          godot --headless --verbose --path . --export-debug "Android" build/android/ShatteredRealms.apk
          test -s build/android/ShatteredRealms.apk
          ls -lh build/android/ShatteredRealms.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-realms-android-debug
          path: build/android/ShatteredRealms.apk
          if-no-files-found: error
